name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,tracking]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (synthetic training, no live API dependency)
        run: docker build --build-arg TRAIN_ARGS="--synthetic --days 60 --skip-backtest" -t carbon-forecaster .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e CARBON_SYNTHETIC=1 carbon-forecaster
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep '"model_loaded":true'
          curl -sf "localhost:8000/forecast?hours=6" | grep '"predicted"'
          docker logs app
